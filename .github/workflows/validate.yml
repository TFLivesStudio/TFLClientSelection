name: Validate Selection manifest contracts

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate pack and channel metadata
        run: python scripts/validate_manifests.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
