name: Stage reviewed Audit 5 optimizer draft
on:
  workflow_dispatch:
    inputs:
      native_acceptance_run:
        description: 'Successful full Core native acceptance run for the pinned Core revision'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: audit5-optimizer-draft
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CORE_SHA: 977ce284fcac52127f4f47e7137b7d6aa3625871
      ACCEPTANCE_RUN: ${{ inputs.native_acceptance_run }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r requirements-dev.txt
      - name: Require successful full native acceptance of the pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run=os.environ['ACCEPTANCE_RUN']
          assert run.isdigit()
          data=json.loads(subprocess.check_output(['gh','api',f'repos/TFLivesStudio/TFLClientMOD/actions/runs/{run}']))
          assert data['conclusion']=='success' and data['head_sha']==os.environ['CORE_SHA']
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/TFLivesStudio/TFLClientMOD/actions/runs/{run}/jobs?per_page=100']))['jobs']
          expected=('1.8.9, baseline','1.8.9, lwjgl3','1.8.9, argentum','26.3, baseline','26.3, sodium','26.3, iris')
          for combo in expected:
              assert any(j['name'].startswith('native (') and combo in j['name'] and j['conclusion']=='success'
                         and any(s['name'].startswith('Installed '+combo.split(',')[0]+' client') and s['conclusion']=='success'
                                 for s in j['steps']) for j in jobs), combo
          PY
      - uses: actions/checkout@v6
        with:
          repository: TFLivesStudio/TFLClientMOD
          ref: 977ce284fcac52127f4f47e7137b7d6aa3625871
          path: core
          persist-credentials: false
      - name: Reproduce binaries, complete sources and exact draft asset layout
        run: |
          python scripts/validate_manifests.py
          python -m unittest discover -s tests -v
          python core/tools/integrations/build_optimizers.py --workspace "$RUNNER_TEMP/upstream"
          python core/tools/integrations/package_sources.py --upstream "$RUNNER_TEMP/upstream" --output "$RUNNER_TEMP/sources"
          python scripts/stage_optimizer_candidates.py --core core --upstream "$RUNNER_TEMP/upstream" --sources "$RUNNER_TEMP/sources" --output staged
      - name: Stage in this repository, never publish or promote the signed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import json;print(json.load(open("drafts/mc-1.8.9-ornithe.json"))["distribution"]["tag"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" staged/* --clobber
          else
            gh release create "$tag" staged/* --draft --prerelease --latest=false --target "$GITHUB_SHA" --title 'Audit 5 — independent optimizer review' --notes-file docs/AUDIT5_REVIEW.md
          fi
